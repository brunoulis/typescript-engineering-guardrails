[package]
name = "telemetry-worker-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
autobins = false

[[bin]]
name = "telemetry-worker"
path = "src/main.rs"

[[bin]]
name = "fault_fixture"
path = "src/bin/fault_fixture.rs"
test = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
