name: TypeScript guardrails validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install locked scanner dependencies
        run: npm ci --ignore-scripts
      - name: Install locked SQLite backend example dependencies
        run: npm --prefix examples/backend ci --ignore-scripts
      - name: Verify scanner, labelled corpus and SQLite backend example
        run: npm run verify
      - name: Measure the fixed corpus in separate processes
        if: runner.os == 'Linux'
        run: node dist/tool/bench/run.js --output '${{ runner.temp }}/benchmark-v2.json'

  data-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, Node 24 action runtime
        with:
          bun-version: '1.3.10'
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: '2.9.8'
      - name: Assert actual runtime versions
        shell: bash
        run: |
          test "$(node --version)" = 'v24.22.1'
          test "$(bun --version)" = '1.3.10'
          test "$(deno --version | head -n 1 | cut -d ' ' -f 2)" = '2.9.8'
      - name: Install locked data and PostgreSQL backend dependencies
        run: |
          npm --prefix examples/data ci --ignore-scripts
          npm --prefix examples/postgres-backend ci --ignore-scripts
      - name: Provision owned digest-pinned PostgreSQL and Timescale fixtures
        run: |
          npm --prefix examples/data run db:up
          npm --prefix examples/postgres-backend run db:prepare
      # These suites reset shared schemas: keep all runtimes in this one sequential job.
      - name: Typecheck and execute Node PostgreSQL and Timescale contracts
        working-directory: examples/data
        run: |
          npm run typecheck
          npm test
      - name: Execute Bun PostgreSQL and Timescale contracts
        working-directory: examples/data
        run: bun src/run-runtime.ts
      - name: Check and execute Deno PostgreSQL and Timescale contracts
        working-directory: examples/data
        run: |
          deno task check
          deno task test
          node src/verify-deno-permissions.ts
      - name: Verify real authentication, HTTP and PostgreSQL persistence
        env:
          BACKEND_MIGRATION_DATABASE_URL: postgres://guardrails:local_guardrails_only@127.0.0.1:55432/guardrails_backend
          BACKEND_TEST_DATABASE_URL: postgres://guardrails_backend_app:local_backend_app_only@127.0.0.1:55432/guardrails_backend
        run: npm --prefix examples/postgres-backend run check
      - name: Remove only the owned database fixtures
        if: always()
        run: npm --prefix examples/data run db:down
